name: Vigilnz Scan Test

on:
  workflow_dispatch:  # Manual trigger from Actions tab

jobs:
  vigilnz-scan:
    name: Run Vigilnz Security Scan
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't fail pipeline if scan fails

    steps:
      # Checkout your code
      - name: Checkout code
        uses: actions/checkout@v4

      # Run Vigilnz Scan
      - name: Run Vigilnz Scan
        uses: vigilnz/vigilnz-scan-action@v1
        with:
          # vigilnzApiKey: ${{ secrets.VIGILNZ_API_KEY }}
          # environment: "dev"
          vigilnzApiKey: ${{ secrets.VIGILNZ_API_KEY_PROD }}
          environment: "prod"
          scanTypes: "sca,secret"
          projectName: "Github_Action"
          waitForCompletion: true

      # Upload results (if action generates reports)
      - name: Upload Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vigilnz-results
          path: |
            *.json
            *.html
          retention-days: 10
          
      # Generate Summary
      - name: Generate Summary
        if: always()
        run: |
          echo "## 🔐 Vigilnz Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📦 Scan Info" >> $GITHUB_STEP_SUMMARY
          echo "- Project: Github_Action" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: dev" >> $GITHUB_STEP_SUMMARY
          echo "- Scan Types: SCA, Secret" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📊 Report Files Generated" >> $GITHUB_STEP_SUMMARY

          files=$(ls *.json 2>/dev/null | wc -l)

          if [ "$files" -eq "0" ]; then
            echo "❌ No JSON report files found" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Found $files JSON report file(s)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            for file in *.json; do
              echo "- 📄 $file" >> $GITHUB_STEP_SUMMARY
            done
          fi

      - name: Parse and Show Vulnerabilities
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚨 Vulnerability Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f results.json ]; then
            critical=$(jq '.critical' results.json)
            high=$(jq '.high' results.json)
            medium=$(jq '.medium' results.json)
            low=$(jq '.low' results.json)

            echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| 🔴 Critical | $critical |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟠 High     | $high |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟡 Medium   | $medium |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟢 Low      | $low |" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ results.json not found" >> $GITHUB_STEP_SUMMARY
          fi
